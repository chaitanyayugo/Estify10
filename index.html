<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ESTIFY • Unified Pricing Engine</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <div class="container">

    <header class="hero">
      <h1>ESTIFY</h1>
      <p>Unified Pricing Engine</p>
    </header>

    <section class="input-card">

      <label class="label">
        Paste Variants
      </label>

      <textarea
        id="input"
        placeholder="Paste variants here..."
      ></textarea>

      <div class="button-row">

        <button id="runBtn">
          Analyze Pricing
        </button>

        <button id="clearBtn" class="secondary">
          Clear
        </button>

      </div>

    </section>

    <section class="summary-card">

      <div class="summary-item">
        <div class="summary-label">
          Status
        </div>

        <div id="summary">
          Waiting...
        </div>
      </div>

      <div class="summary-item">
        <div class="summary-label">
          Base Plan
        </div>

        <div id="odooBase">
          —
        </div>
      </div>

      <div class="summary-item">
        <div class="summary-label">
          Validation
        </div>

        <div id="odooFit">
          —
        </div>
      </div>

    </section>

    <section class="table-card">

      <h2>Results</h2>

      <div class="table-wrap">

        <table id="output">

          <thead>
            <tr>
              <th>Model</th>
              <th>Code</th>
              <th>Grade</th>
              <th>Config</th>
              <th>Price</th>
              <th>Extra</th>
            </tr>
          </thead>

          <tbody></tbody>

        </table>

      </div>

    </section>

    <section class="grid-2">

      <div class="table-card">

        <h2>Configuration Extras</h2>

        <table>
          <thead>
            <tr>
              <th>Config</th>
              <th>Extra</th>
            </tr>
          </thead>

          <tbody id="configOutputBody"></tbody>
        </table>

      </div>

      <div class="table-card">

        <h2>Colour Extras</h2>

        <table>

          <thead>
            <tr>
              <th>Colour</th>
              <th>Extra</th>
            </tr>
          </thead>

          <tbody id="colourOutputBody"></tbody>

        </table>

      </div>

    </section>

    <section class="table-card">

      <h2>Validation Matrix</h2>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Model</th>
              <th>Code</th>
              <th>Config</th>
              <th>Actual</th>
              <th>Predicted</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="validationOutputBody"></tbody>

        </table>

      </div>

    </section>

    <div id="estifyPlans"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
